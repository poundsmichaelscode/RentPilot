services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports: ["4000:4000"]
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
